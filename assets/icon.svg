<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1e1b4b" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Background Rounded Icon -->
  <rect width="512" height="512" rx="128" fill="url(#grad)" />
  
  <!-- Hanger & Tag Graphic -->
  <g filter="url(#shadow)" stroke="#ffffff" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Hook -->
    <path d="M256 140c-20 0-32-16-32-32 0-22 18-40 40-40 24 0 44 18 44 42 0 35-44 50-52 70" />
    <!-- Clothes hanger triangle -->
    <path d="M256 180 L130 290 C120 300 128 320 144 320 L368 320 C384 320 392 300 382 290 Z" fill="#ffffff" fill-opacity="0.1" />
    <!-- Crossbar -->
    <line x1="144" y1="320" x2="368" y2="320" />
    <!-- Shopping tag badge -->
    <g transform="translate(256, 300)">
      <circle cx="0" cy="50" r="48" fill="#10b981" stroke="#ffffff" stroke-width="8"/>
      <path d="M-14 50 L-4 60 L14 40" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>

